name: Мониторинг машиномест

on:
  schedule:
    # Время в расписании GitHub — по Гринвичу (UTC), Москва = UTC+3.
    # 4-19 по UTC = с 7:00 до 22:59 по Москве; ночью бот не запускается.
    # Основной запуск — внешний будильник cron-job.org; это расписание запасное.
    - cron: "*/15 4-19 * * *"
  workflow_dispatch:          # кнопка «Run workflow» (её же нажимает cron-job.org)

permissions:
  contents: write             # нужно, чтобы сохранять состояние и базу между запусками

concurrency:
  group: parking-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Установить библиотеку для Excel
        run: python3 -m pip install --quiet --break-system-packages openpyxl || python3 -m pip install --quiet openpyxl

      - name: Проверить сайт и написать в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Сохранить состояние и базу
        run: |
          git config user.name "parking-bot"
          git config user.email "parking-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновление данных паркинга"
          git pull --rebase
          git push
